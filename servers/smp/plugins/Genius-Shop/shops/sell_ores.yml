# RelapsedMC SMP: ores and minerals (no netherite)
# SELL-ONLY. Every sale lowers that item's sell price for everyone (dynamic-pricing, price-change per item sold);
# prices reset every day at 00:00 New York time. So the server pays out at most about base x items/2 per item per day
# (here ~2500 per item, see the numbers below), plus the 5,000-per-sale cap in config.yml. No money printing.
gui-name: '&l<gradient:#7CFF6B:#38E0FF>Sell: Ores</gradient>'
rows: 3
permission: ''
sell-adds-to-stock: true
allow-sell-stock-overflow: true
stock-reset:
  enabled: true
  type: DAILY
  time: '00:00'
  timezone: America/New_York

items:
  - material: COAL
    sell-price: 0.8
    amount: 64
    dynamic-pricing: true
    price-change: 0.00012800
    lore:
      - '&7Sells for less the more the server buys today.'
