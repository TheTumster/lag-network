name: lag-paper
# laG Paper: Paper 1.21.11 + a few cannon patches (tools/lagpaper/patch.py). Published as release "lag-paper".
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/lag-paper.yml', 'tools/lagpaper/**']

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - name: Paper 1.21.11 source
        run: |
          git config --global user.email "ci@lag.local"
          git config --global user.name "laG CI"
          git clone -q --depth 1 -b ver/1.21.11 https://github.com/PaperMC/Paper paper
          cd paper && echo "Paper commit: $(git rev-parse HEAD)"
      - name: Apply Paper's patches
        working-directory: paper
        run: |
          set -o pipefail
          ./gradlew applyPatches --no-daemon 2>&1 | tail -30
          ls paper-server/src/minecraft/java/net/minecraft/world/entity/item/ | head -5
      - name: Show code we patch (for reference)
        working-directory: paper/paper-server/src/minecraft/java
        run: |
          F=net/minecraft/world/level/block/piston/PistonMovingBlockEntity.java
          grep -n "moveCollidedEntities\|Math.min(d\|finalTick\|moveEntityByPiston\|progressO >= 1\|public static void tick" $F | head -20
          awk '/private static void moveCollidedEntities/,/^    }$/' $F | head -80
          awk '/public static void tick\(/,/^    }$/' $F | head -40
          grep -n -A16 "private Vec3 limitPistonMovement" net/minecraft/world/entity/Entity.java | head -30
          awk '/protected boolean triggerEvent/,/^    }$/' net/minecraft/world/level/block/piston/PistonBaseBlock.java | head -90
      - name: Apply laG cannon patches
        working-directory: paper
        run: python3 ../tools/lagpaper/patch.py paper-server/src/minecraft/java
      - name: Build
        working-directory: paper
        run: |
          set -o pipefail
          ./gradlew createMojmapPaperclipJar --no-daemon 2>&1 | tail -40
          ls -la paper-server/build/libs/
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls paper/paper-server/build/libs/*paperclip*mojmap*.jar | head -1)
          cp "$JAR" lag-paper-1.21.11.jar
          sha256sum lag-paper-1.21.11.jar
          gh release delete lag-paper -y --cleanup-tag 2>/dev/null || true
          gh release create lag-paper lag-paper-1.21.11.jar --title "laG Paper 1.21.11 (cannon patches)" \
            --notes "Paper 1.21.11 (ver/1.21.11) + tools/lagpaper/patch.py: 1.8-style TNT explosion center, explosion aim at TNT/sand middle, east/west cannoning axis order."
          # rebuild the network bundle so START.bat picks up this jar (the push-triggered build may have grabbed the old one)
          gh workflow run build.yml -R ${{ github.repository }} --ref main
