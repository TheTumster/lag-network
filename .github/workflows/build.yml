name: build
on:
  push:
  workflow_dispatch:

concurrency:
  group: network-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  network:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: |
            21
            25
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build laG plugins
        run: |
          chmod +x ./gradlew
          ./gradlew build -Pversion=0.1.${{ github.run_number }} --stacktrace
          mkdir -p localjars
          cp plugins/lag-core/build/libs/lag-core-*.jar localjars/laGCore.jar
          cp plugins/lag-cannons/build/libs/lag-cannons-*.jar localjars/laGCannons.jar
          cp plugins/lag-skyblock/build/libs/lag-skyblock-*.jar localjars/laGSkyblock.jar
          cp plugins/lab18-tools/build/libs/lab18-tools-*.jar localjars/laGLab.jar

      - name: Build FactionsUUID 4.4.3 from source (GPLv3; buy it on SpigotMC once the server goes public)
        run: |
          git clone -q --depth 1 -b 4.4.3 https://github.com/FactionsU/UID fuuid
          cd fuuid && bash ../tools/patches/fuuid-no-graves.sh && chmod +x gradlew && ./gradlew build -x test -q
          ls -la */build/libs build/libs 2>/dev/null || true
          JAR=$(ls -S */build/libs/*.jar build/libs/*.jar 2>/dev/null | grep -viE "sources|javadoc|api|example" | head -1)
          echo "Using $JAR"
          cp "$JAR" ../localjars/FactionsUUID.jar

      - name: Assemble + boot-test the whole network
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          pip install -q pyyaml
          python3 tools/bake.py localjars

      - name: Report
        if: always()
        run: cat dist/bake-report.json 2>/dev/null || true

      - name: Zip
        run: |
          cd dist && zip -qr ../laG-Network.zip laG-Network && ls -la ../laG-Network.zip
          # RelapsedMC resource pack (fixed timestamps so the zip, and its SHA-1, only change when the pack does)
          cd ../resourcepack && find . -exec touch -t 202601010000 {} + && zip -qrX ../RelapsedMC-pack.zip pack.mcmeta pack.png assets && sha1sum ../RelapsedMC-pack.zip

      - name: Publish as latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest laG-Network.zip RelapsedMC-pack.zip network/network.json dist/bake-report.json dist/update-manifest.json localjars/laGCannons.jar localjars/laGSkyblock.jar localjars/laGCore.jar localjars/FactionsUUID.jar localjars/laGLab.jar build/laG-255-datapack.zip windows/START.bat windows/STOP.bat windows/TUNNEL.bat windows/README.txt windows/START-1.8-LAB.bat windows_tools/start.ps1 windows_tools/start-lab.ps1 windows_tools/stop.ps1 windows_tools/tunnel.ps1 \
            --title "RelapsedMC (build ${{ github.run_number }})" \
            --notes "Download laG-Network.zip, extract it anywhere, double-click START.bat." --latest
