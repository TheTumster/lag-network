name: laGSkyblock
version: '${version}'
main: net.lag.skyblock.LagSkyblock
api-version: '1.21'
softdepend: [Vault, Essentials, RoseStacker, BentoBox]
description: RelapsedMC Skyblock - Shards economy, cage ladder, the Collector, Market, gens, island top, Warzone, seasons
commands:
  spawners:
    description: The cage ladder - buy cages (spawners), unlock the next tier with heads
    aliases: [spawnershop, tiers]
  sell:
    description: Sell everything the Collector buys (/sell hand for just your hand)
    aliases: [sellall]
  collector:
    description: The Collector's price list
    aliases: [prices, worth]
  market:
    description: The Market - buy basics and grinder parts
    aliases: [shop, buy]
  gen:
    description: Your island's ore generator tiers
    aliases: [generator, generators, oregen]
  islandfly:
    description: Fly on your own island (rank perk)
    aliases: [isfly]
  istop:
    description: Island top - islands ranked by spawner value (also /is top)
    aliases: [islandtop, top]
  season:
    description: This Skyblock season - time left, top islands, prizes
    aliases: [seasons]
  warzone:
    description: The Warzone - the PvP arena under spawn (envoys, KOTH)
    aliases: [pit, wz, arena, koth, envoy, envoys]
  vault:
    description: Your Offline Vault - what your cages banked while nobody was near them
    aliases: [offline, away, cagevault]
  lagskyblock:
    description: laG Skyblock admin
    aliases: [lsb]
    permission: lag.skyblock.admin
permissions:
  lag.skyblock.islandfly:
    description: Island fly (give it to ranks with LuckPerms)
    default: op
  lag.skyblock.admin:
    default: op
