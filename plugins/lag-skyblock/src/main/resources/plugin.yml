name: laGSkyblock
version: '${version}'
main: net.lag.skyblock.LagSkyblock
api-version: '1.21'
softdepend: [Vault, Essentials, SmartSpawner, EconomyShopGUI, BentoBox]
loadbefore: [SmartSpawner, EconomyShopGUI]
description: RelapsedMC Skyblock - spawner tiers, mob heads, ore gens, island top, the Pit, seasons
commands:
  spawners:
    description: Spawner tiers - buy spawners, unlock the next tier with heads
    aliases: [spawnershop, tiers]
  sellheads:
    description: Sell every mob head in your inventory
    aliases: [sellhead]
  gen:
    description: Your island's ore generator tiers
    aliases: [generator, generators, oregen]
  islandfly:
    description: Fly on your own island (rank perk)
    aliases: [isfly]
  istop:
    description: Island top - islands ranked by spawner value (also /is top)
    aliases: [islandtop, top]
  season:
    description: This Skyblock season - time left, top islands, prizes
    aliases: [seasons]
  pit:
    description: The Pit - the PvP arena at spawn
    aliases: [arena]
  lagskyblock:
    description: laG Skyblock admin
    aliases: [lsb]
    permission: lag.skyblock.admin
permissions:
  lag.skyblock.islandfly:
    description: Island fly (give it to ranks with LuckPerms)
    default: op
  lag.skyblock.admin:
    default: op
