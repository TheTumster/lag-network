# RELAPSEDMC Skyblock crates. They stand on the Crate Vaults island at spawn (at: offset from the spawn floor centre).
# Every key opens the same crate with the same odds, however it was earned:
#   crate give <player> <crate> [amount]      (console: the store, vote plugins, events)
#   crate giveall <crate> [amount]
# Where keys come from: vote = every vote (NuVotifier) · shard = rare envoys, vote crate · relic = legendary envoys,
# KOTH, shard crate · monthly = the store, and a rare pull from the relic crate.
# A reward is ONE of: shards [min, max] | item + amount | cages (n of the player's best unlocked cage) | key + amount |
# commands ({player}). Optional: label, icon. weight = its share of the odds (shown to players as a %).
# After editing: /crate reload
crates:
  vote:
    name: "Vote Crate"
    color: "#7CFF6B"
    at: [37, 2, 37]
    rewards:
      - {weight: 34, shards: [5000, 15000]}
      - {weight: 20, shards: [15000, 40000]}
      - {weight: 12, item: HOPPER, amount: 4}
      - {weight: 10, item: OAK_SAPLING, amount: 8}
      - {weight: 8, item: BONE_MEAL, amount: 32}
      - {weight: 6, item: LAVA_BUCKET, amount: 1}
      - {weight: 5, shards: [75000, 150000]}
      - {weight: 4, key: shard, amount: 1}
      - {weight: 1, cages: 1}
