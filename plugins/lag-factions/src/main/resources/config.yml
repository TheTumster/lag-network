config-version: 2
# laGFactions (RelapsedMC factions layer). /lf reload after editing.

shield:
  enabled: true
  # factions that never picked a window start raidable at this hour (Eastern, 0-23): 20 = 8 PM to 2 AM EST
  default-start: 20
  # moving the window only takes effect this many hours later
  change-delay-hours: 24
  # broadcast to the whole server when a faction with land goes raidable
  announce: true

# /f upgrades. cost = price per level (list length = max level). value = what each level gives (index 0 = no upgrade).
upgrades:
  spawner:
    cost: [1000000, 2000000, 3500000, 5000000, 8000000]
    value: [0, 10, 20, 35, 50, 75]          # % faster spawners in your claims
  farm:
    cost: [750000, 1500000, 2500000, 4000000, 6000000]
    value: [0, 10, 20, 35, 50, 75]          # % chance of an extra cane/cactus/bamboo block per growth
  chest:
    cost: [1000000, 2000000, 3000000]
    value: [3, 4, 5, 6]                     # rows in /f chest
  tnt:
    cost: [1000000, 2000000, 3000000, 5000000]
    value: [250000, 500000, 1000000, 2500000, 5000000]   # TNT bank cap
  warps:
    cost: [1000000, 2000000, 3000000]
    value: [2, 3, 4, 5]                     # /f warps (FactionsUUID allows up to 5)

# /f shop. Spawner prices also set their F-top value (ftop.spawner-values overrides).
shop:
  spawners:
    pig: 25000
    cow: 30000
    chicken: 25000
    zombie: 50000
    skeleton: 60000
    spider: 60000
    cave_spider: 75000
    blaze: 200000
    enderman: 250000
    creeper: 300000
    iron_golem: 2000000
  picks:
    trench5: 500000
    trench7: 1000000
    trench9: 2000000
    tray5: 500000
    tray7: 1000000
    tray9: 2000000
  busters:
    1x1: 500000
    3x3: 3000000

spawners:
  # chance a spawner drops as an item when it's blown up (raid loot)
  explosion-drop-chance: 1.0

ftop:
  default-spawner-value: 10000
  spawner-values: {}

# Raiding outpost (its own world "outpost"): cannon through the walls, break the core (beacon) to capture; owners get this % faster spawners
# and farms. After a capture the fortress rebuilds over rebuild-minutes. /lf outpost rebuild forces a rebuild.
outpost:
  enabled: true
  boost: 25
  rebuild-minutes: 30
  walls: 100              # watered walls around the core (every 5th is obsidian)
  wall-height: 30
  first-build-minutes: 5

# Recolour FactionsUUID's own messages to the RelapsedMC palette on every start.
theme-messages: true

# KOTHs (staff-started): /koth create <name> [radius], /koth start <name> [minutes], /koth stop, /koth list
koth:
  cap-minutes: 10
  reward:
    money: 1000000          # to the winner's faction bank (or the player if factionless)
    gear-pieces: 2          # random Protection 5 netherite armor pieces (tagged KOTH gear)
    protection: 5
    sword: true
    sword-chance: 0.5       # Sharpness 5 netherite sword
    commands: []            # console commands, {player} {faction}
