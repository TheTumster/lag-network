// laGFactions: RelapsedMC's factions layer on top of the FactionsUUID engine (shields, menus, map, upgrades, shop,
// outpost). Compiles against the FactionsUUID jar CI builds from source first (localjars/FactionsUUID.jar).
def fuuid = rootProject.file('localjars/FactionsUUID.jar')
repositories {
	maven { url = 'https://jitpack.io' }
}
dependencies {
	compileOnly files(fuuid)
	compileOnly('com.github.MilkBowl:VaultAPI:1.7.1') { transitive = false }
}
tasks.named('compileJava') {
	doFirst {
		if (!fuuid.exists()) throw new GradleException("localjars/FactionsUUID.jar missing: build FactionsUUID first (see .github/workflows/build.yml)")
	}
}
