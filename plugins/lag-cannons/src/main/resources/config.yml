# laG Cannons - every value can be changed live with /lc reload.

tnt:
  # Vanilla gives freshly lit TNT a small random sideways kick. 1.8 cannon servers remove it so
  # every shot is identical. false = no kick (recommended).
  random-kick: false
  # Keep vanilla's little upward pop when TNT is lit (0.2). Set 0 for a pure drop.
  prime-y-velocity: 0.2
  # Merging identical TNT into one stack saves lag but breaks cannons: stacked TNT must explode one by one,
  # each pushing the rest (parity test: merge on = TNT scattered up to 2000 blocks). Keep false.
  merge: false
  # TNT lives 1 tick longer, like 1.8 (1.8 explodes after 81 ticks, modern after 80). Cannons are timed to the tick.
  legacy-fuse: true

# Blocks that take several hits instead of being immune (classic "obby breaking").
durability:
  enabled: true
  # How far from an explosion (in blocks) these blocks get damaged.
  radius: 1.5
  # TNT that explodes in water does NOT damage these blocks (vanilla-style water protection).
  water-protects: true
  # Damage heals after this many seconds without being hit. 0 = never heals.
  regen-seconds: 300
  # Drop the block as an item when it breaks.
  drop: false
  blocks:
    OBSIDIAN: 4
    CRYING_OBSIDIAN: 5
    ENCHANTING_TABLE: 4
    ENDER_CHEST: 3
    ANVIL: 3
    CHIPPED_ANVIL: 2
    DAMAGED_ANVIL: 1
    RESPAWN_ANCHOR: 5

# Right-click a block with this item to see how many hits it has left.
checker-item: POTATO

# Flowing water/lava normally washes away redstone. Cannon servers turn that off so water-based cannons don't break themselves.
water-proof:
  enabled: true
  blocks:
    - REDSTONE_WIRE
    - REPEATER
    - COMPARATOR
    - REDSTONE_TORCH
    - REDSTONE_WALL_TORCH
    - LEVER
    - TRIPWIRE
    - TRIPWIRE_HOOK
    - "*_BUTTON"
    - "*_PRESSURE_PLATE"
    - RAIL
    - POWERED_RAIL
    - DETECTOR_RAIL
    - ACTIVATOR_RAIL

# Sandbots: bots that keep refilling sand at spots you mark (for sand-based cannons).
sandbots:
  # Default refill rate in ticks (20 = 1 second). Players change it per bot with /sandbot speed <ticks>.
  interval-ticks: 2
  # Fastest rate non-admins can set (admins can go down to 1 = every tick).
  min-interval-ticks: 2
  # Max spots one bot can manage, and max bots per player.
  max-spots: 64
  max-bots-per-player: 5
  # Spots must be within this many blocks of the bot.
  range: 16
  # What they place. SAND, RED_SAND, GRAVEL, or any *_CONCRETE_POWDER.
  material: SAND

# WorldEdit/FAWE pastes leave redstone dust unconnected. This reconnects it automatically after //paste,
# and on demand with /fixredstone [radius].
redstone-fix:
  after-paste: true
  radius: 48
  delay-ticks: 40

# Sand comps / double piston extenders: front piston waits to be pushed, and resets in the right order.
# Without it, every other piston in a comp row jams (block update order depends on location).
piston-order-fix: true

# Cannon testing: in these worlds, blocks with a diamond block somewhere below them can't be blown up
# (put diamond under a test cannon instead of watering it). Keep it OFF on real factions worlds:
# players could make unraidable walls. Example: worlds: [cannontest]
cannon-protect:
  worlds: []

# Falling sand/gravel that breaks (lands on a slab, piston head, carpet...) drops nothing. true = vanilla item drops.
falling-blocks:
  drop-items: false

# Classic factions PvP: these items can't be crafted, used, picked up or kept. "*_SPEAR" = every spear.
# Empty list ([]) = allow everything. Permission lagcannons.banneditems.bypass ignores this (not given by default).
banned-items:
  - SHIELD
  - MACE
  - "*_SPEAR"

# Cannon-safe ClearLag: clears dropped items (and stuck arrows) on a timer. Never touches TNT, falling sand,
# minecarts, armor stands, item frames, mobs or named items. worlds: [] = all worlds.
clearlag:
  enabled: true
  interval-seconds: 300
  warn-at: [60, 30, 10, 5, 4, 3, 2, 1]
  clear:
    items: true
    arrows: true
    xp-orbs: false
  keep-items: [BEACON, DRAGON_EGG, NETHER_STAR, ELYTRA]
  worlds: []

# Cannon test server: anyone in creative gets free /tntfill (no faction bank needed).
tntfill:
  free-for-all: false

# Cannon test plots: private islands in a separate "plots" world (only switch on for the cannon test server).
# gap = empty void between plots, wider than view distance, so nobody can see (or skid) another plot.
# Players can only be inside plots they own or were /plot add-ed to.
plots:
  enabled: false
  world: plots
  size: 128
  gap: 400
  max-per-player: 1

# Relapse factions ruleset (Relapse #1 brief).
relapse:
  # /f ally and /f truce are refused (tools/bake.py also sets FactionsUUID maxRelations ally/truce to 0)
  no-allies: true
  # /f alt invite|accept|leave|kick|list. Alts are linked to a faction but aren't members, so they don't count toward
  # the 8-man cap. They can stand in claim and AFK spawners/farms only: no damage, building, breaking, containers,
  # item pickup/drop or block clicks (doors/trapdoors/gates excepted). Needs FactionsUUID (off automatically
  # without it). Saved in plugins/laGCannons/alts.yml:
  # delete that file on map reset.
  alts:
    enabled: true
  # Enchant cap + KOTH-only items. KOTH rewards are tagged with /lc kothgear [protection level] and skip both rules.
  gear-rules: true
  enchant-cap:
    protection: 4
    unbreaking: 3
  # Can't be smithed, are stripped from loot, and can't be worn/used unless tagged as KOTH gear (all netherite gear)
  koth-only:
    - NETHERITE_HELMET
    - NETHERITE_CHESTPLATE
    - NETHERITE_LEGGINGS
    - NETHERITE_BOOTS
    - NETHERITE_SWORD
    - NETHERITE_AXE
    - NETHERITE_PICKAXE
    - NETHERITE_SHOVEL
    - NETHERITE_HOE
# Sakura's client-lag tools for every player (only on the Sakura servers: factions + cannons):
# /fps opens a menu to hide TNT, sand, explosion particles, spawners and pistons; /tnttoggle and /sandtoggle are
# quick toggles. Hidden stuff isn't sent to that player's client at all, the server still runs the cannon normally.
fps-menu:
  enabled: true
