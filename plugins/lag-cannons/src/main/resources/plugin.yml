name: laGCannons
version: '${version}'
main: net.lag.cannons.LagCannons
api-version: '1.21'
softdepend: [WorldGuard, FastAsyncWorldEdit, Factions, FactionsUUID]
description: laG cannon physics - predictable TNT, raid-able obsidian, cannon tools
commands:
  lagcannons:
    description: laG Cannons admin
    aliases: [lc]
    permission: lag.cannons.admin
  tntfill:
    description: Fill nearby dispensers from your faction's TNT bank (same as /f tntfill)
    aliases: [tf]
    permission: lag.cannons.tntfill
  sandbot:
    description: Sand bots that refill sand at marked spots
    aliases: [sandbots, sb]
    permission: lag.cannons.sandbot
  fixredstone:
    description: Reconnect redstone dust around you (after pasting cannons)
    aliases: [fr, redstonefix]
    permission: lag.cannons.fixredstone
  /upload:
    description: Download a schematic from a link into the FAWE/WorldEdit schematics folder
    usage: //upload <link> [name]
    aliases: [schemupload]
    permission: lag.cannons.upload
  clearlag:
    description: Time until the next dropped-item clear (/clearlag now to clear)
    aliases: [lagg, cl]
  plot:
    description: Cannon test plots (/plot auto, home, add, remove, clear, info)
    aliases: [p, plots]
permissions:
  lag.cannons.plot.admin:
    default: op
  lag.cannons.clearlag.now:
    default: op
  lagcannons.tntfill.free:
    default: op
  lag.cannons.admin:
    default: op
  lag.cannons.tntfill:
    default: true
  lag.cannons.upload:
    default: op
  lag.cannons.sandbot:
    default: true
  lag.cannons.fixredstone:
    default: true
  lagcannons.banneditems.bypass:
    default: false
