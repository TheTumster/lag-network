name: laGLab
version: ${version}
main: net.lag.lab.LabTools
description: laG 1.8 cannon lab helpers
commands:
  tntfill:
    description: Fill dispensers around you with TNT
    usage: /tntfill [radius] [amount per dispenser]
    aliases: [tf]
  sandbot:
    description: Sand bots that refill sand at marked spots
    aliases: [sandbots, sb]
  pistonfix:
    description: Toggle the 1.8 piston update fix (pistons under a redstone change always re-check power)
    usage: /pistonfix [on|off]
  /upload:
    description: Download a schematic from a link into WorldEdit's schematics folder
    usage: //upload <link> [name]
    aliases: [schemupload]
    permission: lab.upload
permissions:
  lab.upload:
    default: op
