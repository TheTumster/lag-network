    <#5B1FA0><bold>I. THE RELAPSE</bold>

    <#2B2238>The old world did
    not end all at once.

    It cracked. A little
    more every season,
    until the ground
    itself gave way.

    What was left split
    in two: the world
    that held, and the
    world that rotted.
  - |-
    <#2B2238>The ones who stayed
    learned the only
    rule here:

    <#5B1FA0><bold>nothing lasts.</bold>

    <#2B2238>Maps burn. Islands
    sink. Empires are
    raided into dust.

    And every time, they
    come back for one
    more run.

    <#5B1FA0><italic>Nobody quits.
    Everybody relapses.
  - |-
