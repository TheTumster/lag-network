# Core plugin. The SAME network name goes in every server's copy of this file.
network-name: "RelapsedMC"

# What this server is: hub, factions or smp. Hub features (selector item, no damage, etc.) only run on the hub.
role: hub

# Realms shown in the server selector. "server" must match the name in the proxy's velocity.toml.
realms:
  skyblock:
    server: skyblock
    name: "<gradient:#7CFF6B:#38E0FF><bold>SKYBLOCK</bold></gradient>"
    icon: GRASS_BLOCK
    slot: 10
    lore:
      - "<gray>Competitive islands, grinding, spawners."
      - "<gray>Island top • challenges • shop"
      - ""
      - "<#38E0FF>▶ Click to play"
  factions:
    server: factions
    name: "<gradient:#FF4D6D:#B040FF><bold>FACTIONS</bold></gradient>"
    icon: TNT
    slot: 12
    lore:
      - "<gray>Raid, cannon, claim, conquer."
      - "<gray>1.8 PvP  •  1.8 cannon physics"
      - ""
      - "<#38E0FF>▶ Click to play"
  cannons:
    server: cannons
    name: "<gradient:#FF9F4D:#FF4D6D><bold>CANNONS</bold></gradient>"
    icon: DISPENSER
    slot: 14
    lore:
      - "<gray>Test cannons on the exact Factions jar."
      - "<gray>Creative • free /tntfill • diamond protection"
      - ""
      - "<#38E0FF>▶ Click to play"
  smp:
    server: smp
    name: "<gradient:#7CFF6B:#38E0FF><bold>SMP</bold></gradient>"
    icon: OAK_SAPLING
    slot: 16
    lore:
      - "<gray>Chill survival with land claims."
      - ""
      - "<#38E0FF>▶ Click to play"
# Fresh chat: wipe the chat when you arrive on a server, then show that realm's banner (the hub has its own).
# {bar} {logo} {arrow} {player} {online}
fresh-chat:
  enabled: true
  delay-ticks: 10
  banner:
    factions:
      - "{bar}"
      - "            {logo} <dark_gray>» <gradient:#FF4D6D:#B040FF><bold>FACTIONS</bold></gradient>"
      - ""
      - "  {arrow} <gray>Start a faction: <white>/f create <name>"
      - "  {arrow} <gray>Fill dispensers: <white>/tntfill <dark_gray>• <gray>faction bank: <white>/f tnt"
      - "  {arrow} <gray>Back to the hub: <white>/hub"
      - "{bar}"
    skyblock:
      - "{bar}"
      - "            {logo} <dark_gray>» <gradient:#7CFF6B:#38E0FF><bold>SKYBLOCK</bold></gradient>"
      - ""
      - "  {arrow} <gray>Start your island: <white>/is"
      - "  {arrow} <gray>Island top: <white>/is top <dark_gray>• <gray>Season: <white>/season <dark_gray>• <gray>Shop: <white>/shop"
      - "  {arrow} <gray>Spawners: <white>/spawners <dark_gray>• <gray>Ore gen: <white>/gen <dark_gray>• <gray>PvP: <white>/pit"
      - "  {arrow} <gray>Back to the hub: <white>/hub"
      - "{bar}"
    cannons:
      - "{bar}"
      - "            {logo} <dark_gray>» <gradient:#FF9F4D:#FF4D6D><bold>CANNONS</bold></gradient>"
      - ""
      - "  {arrow} <gray>Get a plot: <white>/plot auto <dark_gray>• <gray>go back: <white>/plot home"
      - "  {arrow} <gray>Same jar and cannon settings as Factions"
      - "  {arrow} <gray>Free fill: <white>/tntfill <dark_gray>• <gray>Diamond block under = unbreakable"
      - "  {arrow} <gray>Back to the hub: <white>/hub"
      - "{bar}"
    smp:
      - "{bar}"
      - "            {logo} <dark_gray>» <gradient:#7CFF6B:#38E0FF><bold>SMP</bold></gradient>"
      - ""
      - "  {arrow} <gray>Chill survival with land claims"
      - "  {arrow} <gray>Back to the hub: <white>/hub"
      - "{bar}"

# Ranks: how each one shows before a name (chat, tab, above heads, scoreboard). Order = tab order.
# A player's rank: rank-players below, else the first LuckPerms group they're in (lp user <name> parent add <rank>).
ranks:
  owner: "<gradient:#B040FF:#FF4DD2><bold>OWNER</bold></gradient>"
  admin: "<#FF6B3B><bold>ADMIN</bold>"
  mod: "<#38E0FF><bold>MOD</bold>"
  media: "<#FF4DD2><bold>MEDIA</bold>"
  vip: "<#B040FF><bold>VIP</bold>"
rank-players:
  SonOfJesus420: owner

# Season titles (e.g. S1 CHAMPION from Skyblock) shown before the rank in chat and tab. One file shared by every
# server in the network (relative to the server's folder); Skyblock writes it when a season ends.
titles-file: "../shared/titles.yml"

# Chat format: "<title> <rank> Name » message"
chat:
  enabled: true

# Realm spawn islands (built once on first start of that server; walk into the purple ring = back to the hub).
# y: a height, or "ground" to sit on the terrain at 0,0. protect-radius: no building/PvP/explosions that close.
spawns:
  factions:
    y: ground
    protect-radius: 30
    catch-falls: false
    portals:
      hub: [0, 5, -15]
    holograms:
      - offset: [0.5, 4.6, -7.5]
        scale: 3
        text: "<gradient:#FF4D6D:#B040FF:#FF4D6D:{phase}><bold>FACTIONS</bold></gradient>"
      - offset: [0.5, 3.2, -7.5]
        scale: 1.1
        text: "<gray>Make a faction <white>/f create <name>   <gray>Fill dispensers <white>/tntfill\n<gray>Faction info <white>/f who   <gray>Back to the hub: walk into the ring"
      - offset: [0.5, 10.6, -15]
        scale: 1.4
        text: "<gradient:#38E0FF:#B040FF><bold>HUB</bold></gradient>"
  skyblock:
    y: 100
    protect-radius: 46
    catch-falls: true
    portals:
      hub: [0, 5, -21]
    holograms:
      - offset: [0.5, 4.6, -7.5]
        scale: 3
        text: "<gradient:#7CFF6B:#38E0FF:#7CFF6B:{phase}><bold>SKYBLOCK</bold></gradient>"
      - offset: [0.5, 3.5, -7.5]
        scale: 1
        text: "<gray>Turn left for the <white>Getting Started</white> board"
      - offset: [0.5, 6.4, -7.5]
        scale: 0.85
        text: "<dark_gray><italic>When the Corrupted world collapsed, the pieces that didn't fall became islands.\n<dark_gray><italic>Every month the void takes them back."
      - offset: [0.5, 3.4, 20.5]
        scale: 1.4
        text: "<gradient:#FF4D6D:#B040FF:#FF4D6D:{phase}><bold>THE PIT</bold></gradient>\n<gray>The only PvP on Skyblock <dark_gray>• <white>/pit"
      - offset: [0.5, 13.2, -20.5]
        scale: 1.4
        text: "<gradient:#38E0FF:#B040FF><bold>HUB</bold></gradient>"
      - offset: [16.5, 6.2, 0.5]
        scale: 1.6
        text: "<gradient:#7CFF6B:#38E0FF><bold>MARKET</bold></gradient>"
      - offset: [16.5, 5.5, 0.5]
        scale: 0.9
        text: "<gray>Buy and sell <white>/shop"
  cannons:
    y: ground
    protect-radius: 25
    catch-falls: false
    portals:
      hub: [0, 5, -15]
    holograms:
      - offset: [0.5, 4.6, -7.5]
        scale: 3
        text: "<gradient:#FF9F4D:#FF4D6D:#FF9F4D:{phase}><bold>CANNONS</bold></gradient>"
      - offset: [0.5, 3.2, -7.5]
        scale: 1.1
        text: "<gray>Get your own plot: <white>/plot auto <dark_gray>• <white>/plot home <dark_gray>• <white>/plot add <player>\n<white>/tntfill <gray>free fill <dark_gray>• <white>//upload <link> <gray>then <white>//schem load <dark_gray>• <gray>same jar as Factions"
      - offset: [0.5, 10.6, -15]
        scale: 1.4
        text: "<gradient:#38E0FF:#B040FF><bold>HUB</bold></gradient>"

# Console commands run once, the first time that server starts (per role).
first-start-commands:
  skyblock:
    - "bsbadmin challenges import"
  cannons:
    # plot owners can //paste and //schem inside their own plot (FAWE limits edits to WorldGuard plot regions)
    - "lp group default permission set worldedit.* true"
    - "lp group default permission set lag.cannons.upload true"

# Resource pack (logo, icons, menus). Built from resourcepack/ and published with every release.
resource-pack:
  enabled: true
  required: false
  url: "https://github.com/TheTumster/lag-network/releases/latest/download/RelapsedMC-pack.zip"

hub:
  # Spawn is set with /setspawn; until then players spawn at the world spawn.
  spawn: ""
  double-jump: true
  void-y: -64
  join-title: true
  # Spawn island (tools/hub/genspawn.py). Built once at y=100 on first start; /lagcore rebuildhub places it again.
  auto-build: true
  night: true
  time: 18000
  # Walk into a portal = join that realm. [x, y, z] from the spawn floor centre (spawn faces north = -z).
  portals:
    skyblock: [-34, 7, -36]
    factions: [-12, 7, -48]
    cannons: [12, 7, -48]
    smp: [34, 7, -36]
  # The beacon under the crystal (particle helix), from the spawn.
  beacon: [0, -1, -28]
  # Floating text ([x, y, z] from the spawn floor centre). {factions} {smp} {online} = player counts,
  # {phase} = moving gradient (animates every 2 ticks), {logo} = the pack logo.
  holograms:
    - offset: [0.5, 5.6, -7.5]
      scale: 2
      text: "{logo}"
    - offset: [0.5, 3.5, -7.5]
      scale: 1.1
      text: "<gray>Pick a path and walk into a portal\n<dark_gray>Discord <gray>← <dark_gray>• <gray>→ <dark_gray>Parkour    <white>{online} <gray>online"
    - offset: [-33.5, 9.8, -26.5]
      scale: 3.6
      text: "<gradient:#7CFF6B:#38E0FF:#7CFF6B:{phase}><bold>SKYBLOCK</bold></gradient>\n<white>{skyblock} <gray>playing"
    - offset: [-11.5, 9.8, -38.5]
      scale: 3.6
      text: "<gradient:#FF4D6D:#B040FF:#FF4D6D:{phase}><bold>FACTIONS</bold></gradient>\n<white>{factions} <gray>playing"
    - offset: [12.5, 9.8, -38.5]
      scale: 3.6
      text: "<gradient:#FF9F4D:#FF4D6D:#FF9F4D:{phase}><bold>CANNONS</bold></gradient>\n<white>{cannons} <gray>playing"
    - offset: [34.5, 9.8, -26.5]
      scale: 3.6
      text: "<gradient:#7CFF6B:#38E0FF:#7CFF6B:{phase}><bold>SMP</bold></gradient>\n<white>{smp} <gray>playing"
    - offset: [-26.5, 9.6, -3.5]
      scale: 1.2
      text: "<gradient:#B040FF:#38E0FF:#B040FF:{phase}><bold>DISCORD</bold></gradient>\n<gray>Coming soon"
  # Spinning, glowing 3D items (the realm icons spin inside their portals). glow = outline colour.
  displays:
    - offset: [0.5, 28.5, -27.5]
      item: NETHER_STAR
      scale: 3
      spin: 1
      glow: "#B040FF"
    - offset: [-33.5, 7.2, -32.7]
      item: GRASS_BLOCK
      scale: 4
      spin: 1
      glow: "#7CFF6B"
    - offset: [-11.5, 7.2, -44.7]
      item: TNT
      scale: 4
      spin: 1
      glow: "#FF4D6D"
    - offset: [12.5, 7.2, -44.7]
      item: DISPENSER
      scale: 4
      spin: 1
      glow: "#FF9F4D"
    - offset: [34.5, 7.2, -32.7]
      item: OAK_SAPLING
      scale: 4
      spin: 1
      glow: "#7CFF6B"
    - offset: [-26.5, 7.2, -3.5]
      item: ECHO_SHARD
      scale: 1.6
      spin: -1
  # Heavy pressure plates on the paths launch you outward.
  launch-pad:
    speed: 1.25
    lift: 0.85
  # Boss bar messages, 8s each. {gradient}...</gradient> = moving brand gradient.
  bossbar:
    - "<gray>Welcome to {gradient}<bold>{network}</bold></gradient>"
    - "{gradient}<bold>FACTIONS</bold></gradient> <dark_gray>» <gray>1.8 cannons, raids, faction TNT banks"
    - "<white>{online} <gray>players online <dark_gray>• <gray>walk into a portal to play"
    - "{gradient}<bold>COSMETICS</bold></gradient> <dark_gray>» <gray>grab a particle trail from your hotbar"

scoreboard:
  enabled: true
  footer: "<gradient:#38E0FF:#B040FF>RelapsedMC</gradient>"
