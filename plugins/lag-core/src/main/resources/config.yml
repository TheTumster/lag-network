# Core plugin. The SAME network name goes in every server's copy of this file.
network-name: "RelapsedMC"

# What this server is: hub, factions or smp. Hub features (selector item, no damage, etc.) only run on the hub.
role: hub

# Realms shown in the server selector. "server" must match the name in the proxy's velocity.toml.
realms:
  skyblock:
    server: skyblock
    name: "<#5CFF8A><bold>SKYBLOCK</bold></#5CFF8A>"
    icon: GRASS_BLOCK
    slot: 10
    lore:
      - "<gray>Competitive islands, real mob grinders."
      - "<gray>Cage ladder • Warzone • monthly seasons"
      - ""
      - "<#FF6B6B>▶ Click to play"
  factions:
    server: factions
    name: "<#FF4F64><bold>FACTIONS</bold></#FF4F64>"
    icon: TNT
    slot: 12
    lore:
      - "<gray>Raid, cannon, claim, conquer."
      - "<gray>1.8 PvP  •  1.8 cannon physics"
      - ""
      - "<#FF6B6B>▶ Click to play"
  cannons:
    server: cannons
    name: "<#FFAA45><bold>CANNONS</bold></#FFAA45>"
    icon: DISPENSER
    slot: 14
    lore:
      - "<gray>Test cannons on the exact Factions jar."
      - "<gray>Creative • free /tntfill • diamond protection"
      - ""
      - "<#FF6B6B>▶ Click to play"
  smp:
    server: smp
    name: "<#45C8FF><bold>SMP</bold></#45C8FF>"
    icon: OAK_SAPLING
    slot: 16
    lore:
      - "<gray>Chill survival with land claims."
      - ""
      - "<#FF6B6B>▶ Click to play"
# Fresh chat: wipe the chat when you arrive on a server, then show that realm's banner (the hub has its own).
# {bar} {logo} {arrow} {player} {online}
fresh-chat:
  enabled: true
  delay-ticks: 10
  # {logo} = big wordmark, {c} = center the line, [[label|/command or https link|hover]] = button,
  # {player} {online} {realm} {discord} {store}. The hub's welcome uses "hub" (built-in default if missing).
  banner:
    factions:
      - "{logo}"
      - ""
      - "{c}<#FF4F64><bold>FACTIONS</bold></#FF4F64> <dark_gray>•</dark_gray> <white>8-mans</white> <dark_gray>•</dark_gray> <gray>no allies <dark_gray>•</dark_gray> <gray>1.8 cannons"
      - ""
      - "{c}[[<#FF4D6D><bold>⚔ START</bold>|/f create|<gray>Make a faction: <white>/f create <name>]]   [[<#FFA19A><bold>☰ GUIDE</bold>|/spawn|<gray>Back to spawn: the kiosk explains everything]]   [[<#FF6B6B><bold>⌂ HUB</bold>|/hub|<gray>Back to the hub]]"
      - ""
    skyblock:
      - "{logo}"
      - ""
      - "{c}<#5CFF8A><bold>SKYBLOCK</bold></#5CFF8A> <dark_gray>•</dark_gray> <gray>grind <dark_gray>•</dark_gray> <gray>spawners <dark_gray>•</dark_gray> <gray>monthly seasons"
      - ""
      - "{c}[[<#7CFF6B><bold>⬢ ISLAND</bold>|/is|<gray>Create or go to your island]]   [[<#FFA19A><bold>◆ SELL</bold>|/sell|<gray>Sell everything to the Collector]]   [[<#FFD24D><bold>★ TOP</bold>|/is top|<gray>Island top]]   [[<#FF6B6B><bold>⌂ HUB</bold>|/hub|<gray>Back to the hub]]"
      - ""
    cannons:
      - "{logo}"
      - ""
      - "{c}<#FFAA45><bold>CANNONS</bold></#FFAA45> <dark_gray>•</dark_gray> <gray>same jar as Factions <dark_gray>•</dark_gray> <gray>your own plot"
      - ""
      - "{c}[[<#FF9F4D><bold>⬛ PLOT</bold>|/plot auto|<gray>Get your own plot]]   [[<#FF4D6D><bold>➹ HOME</bold>|/plot home|<gray>Back to your plot]]   [[<#FF6B6B><bold>⌂ HUB</bold>|/hub|<gray>Back to the hub]]"
      - ""
    smp:
      - "{logo}"
      - ""
      - "{c}<#45C8FF><bold>SMP</bold></#45C8FF> <dark_gray>•</dark_gray> <gray>survival <dark_gray>•</dark_gray> <gray>land claims <dark_gray>•</dark_gray> <gray>never resets"
      - ""
      - "{c}[[<#7CFF6B><bold>➹ WILD</bold>|/rtp|<gray>Random teleport into the wild]]   [[<#FFD24D><bold>⌂ HOME</bold>|/home|<gray>Go to your home]]   [[<#FF6B6B><bold>⌂ HUB</bold>|/hub|<gray>Back to the hub]]"
      - ""

# Links for chat buttons ({discord}, {store}). Empty = the button just shows its hover text.
links:
  discord: "https://discord.gg/G4pHKXDDru"
  website: "https://relapsedmc.com"
  store: ""

# /help menu, the same on every realm. "/command|what it does|ICON". Top row = network, then the realm's own (7 per row).
help:
  accent: {hub: "#FF6B6B", skyblock: "#5CFF8A", factions: "#FF4F64", cannons: "#FFAA45", smp: "#45C8FF"}
  network:
    - "/server|open the realm menu (or /server <realm>)|COMPASS"
    - "/hub|back to the hub|NETHER_STAR"
    - "/spawn|this realm's spawn|RED_BED"
    - "/team|your team, on every realm|TOTEM_OF_UNDYING"
    - "/tc <message>|team chat|WRITABLE_BOOK"
  realm:
    hub:
      - "/server skyblock|jump into Skyblock|GRASS_BLOCK"
      - "/server factions|jump into Factions|TNT"
      - "/server cannons|jump into Cannons|DISPENSER"
      - "/server smp|jump into the SMP|OAK_SAPLING"
    skyblock:
      - "/is|your island (create, home, team)|GRASS_BLOCK"
      - "/sell|sell loot to the Collector|EMERALD"
      - "/collector|loot prices|BOOK"
      - "/market|buy blocks, tools and more|CHEST"
      - "/spawners|the cage ladder|SPAWNER"
      - "/gen|your island's ore generator|DIAMOND_ORE"
      - "/istop|island top|GOLDEN_HELMET"
      - "/season|this season's prizes and time left|CLOCK"
      - "/warzone|PvP, envoys and KOTH|NETHERITE_SWORD"
      - "/ah|auction house|GOLD_INGOT"
      - "/isfly|island fly (rank perk)|FEATHER"
    factions:
      - "/f help|every faction command|BOOK"
      - "/f create <name>|start a faction (8 max)|RED_BANNER"
      - "/f tnt|your faction's TNT bank|TNT"
      - "/pv 1|your private vault|ENDER_CHEST"
      - "/fps|hide TNT, sand and explosions|ENDER_EYE"
    cannons:
      - "/plot auto|get your own plot|GRASS_BLOCK"
      - "/plot home|back to your plot|RED_BED"
      - "/tntfill|fill dispensers with TNT (free)|DISPENSER"
      - "//upload <link>|load a schematic, then //schem load|WOODEN_AXE"
      - "/fps|hide TNT, sand and explosions|ENDER_EYE"
    smp:
      - "/claimhelp|land claims and trust menu|GOLDEN_SHOVEL"
      - "/sethome|save a home (more with ranks)|WHITE_BED"
      - "/home|go home|RED_BED"
      - "/tpa <player>|ask to teleport|ENDER_PEARL"
      - "/rtp|random teleport into the wild|COMPASS"
      - "/shop|buy and sell items|EMERALD"
      - "/sit|sit anywhere|OAK_STAIRS"

# Ranks: how each one shows before a name (chat, tab, above heads, scoreboard). Order = tab order.
# A player's rank: rank-players below, else the first LuckPerms group they're in (lp user <name> parent add <rank>).
ranks:
  owner: "<gradient:#B040FF:#FF4DD2><bold>OWNER</bold></gradient>"
  admin: "<#FF6B3B><bold>ADMIN</bold>"
  mod: "<#FF6B6B><bold>MOD</bold>"
  media: "<#FF4DD2><bold>MEDIA</bold>"
  vip: "<#B040FF><bold>VIP</bold>"
rank-players:
  SonOfJesus420: owner

# Season titles (e.g. S1 CHAMPION from Skyblock) shown before the rank in chat and tab. One file shared by every
# server in the network (relative to the server's folder); Skyblock writes it when a season ends.
titles-file: "../shared/titles.yml"

# Current factions map (holograms: {map}, {reset}). Dates are local to "timezone", format 2026-12-12T18:00.
# Before "starts": "Launches in 3d 4h". Before "ends": "Resets in 12d 4h". No dates: shows "status".
map:
  name: "RELAPSE #1"
  starts: ""
  ends: ""
  timezone: America/New_York
  status: "<gray>Launching <white>December"

# Chat format: "<title> <rank> Name » message"
chat:
  enabled: true

# Realm spawn islands (built once on first start of that server; walk into the purple ring = back to the hub).
# y: a height, or "ground" to sit on the terrain at 0,0. protect-radius: no building/PvP/explosions that close.
spawns:
  factions:
    # v2 "the Fault" (tools/hub/genspawn_factions.py): Classic half west, Corrupted half east, hub portal north,
    # Fractured Obelisk south, Getting Started kiosk west (panels.yml), Top Factions podium east.
    y: ground
    protect-radius: 40
    catch-falls: false
    portals:
      hub: [0, 8, -22]
    holograms:
      - offset: [0.5, 6.2, -9.5]
        scale: 3.4
        text: "<gradient:#FF4D6D:#B040FF:#FF4D6D:{phase}><bold>{map}</bold></gradient>"
      - offset: [0.5, 5.0, -9.5]
        scale: 1.25
        text: "<white><bold>FACTIONS</bold> <dark_gray>• {reset}"
      - offset: [0.5, 3.9, -9.5]
        scale: 0.9
        text: "<gray>8-mans <dark_gray>• <gray>no allies <dark_gray>• <gray>18h shields <dark_gray>• <gray>KOTH-only netherite\n<dark_gray>Turn around for the Obelisk <dark_gray>• <gray>left: <white>Getting Started <dark_gray>• <gray>right: <white>Top Factions"
      - offset: [0.5, 15.6, -22]
        scale: 1.6
        text: "<gradient:#FF5C5C:#FFA19A><bold>HUB</bold></gradient>"
      - offset: [-17.5, 8.8, 0.5]
        scale: 1.5
        text: "<gradient:#FF4D6D:#FFD24D:#FF4D6D:{phase}><bold>NEW HERE?</bold></gradient>"
      - offset: [20.5, 4.6, 0.5]
        scale: 1.25
        text: "<gradient:#FFD24D:#FF9F4D:#FFD24D:{phase}><bold>TOP FACTIONS</bold></gradient>\n{ftop}"
      - offset: [20.5, 11.0, 0.5]
        scale: 0.95
        text: "<gray>KOTH gear <dark_gray>• <white>Protection 5 <dark_gray>• <white>Netherite\n<dark_gray>Only from KOTHs"
      - offset: [0.5, 3.2, 12.5]
        scale: 0.9
        text: "<gradient:#FF4D6D:#B040FF><bold>THE FAULT</bold></gradient>\n<dark_gray><italic>Two worlds. One map. Three weeks.\n<dark_gray><italic>Classic holds. Corrupted rots. Both burn."
      - offset: [-33.5, 17.0, 0.5]
        scale: 2.2
        text: "<gradient:#FF4D6D:#FFD24D><bold>CLASSIC</bold></gradient>"
      - offset: [34.5, 13.5, 0.5]
        scale: 2.2
        text: "<gradient:#FFA19A:#FF5C5C><bold>CORRUPTED</bold></gradient>"
      - offset: [24.5, 7.2, 24.5]
        scale: 1
        text: "<gray>Wilderness <dark_gray>↘"
      - offset: [-23.5, 7.2, 24.5]
        scale: 1
        text: "<gray>Wilderness <dark_gray>↙"
      - offset: [-23.5, 7.2, -23.5]
        scale: 1
        text: "<gray>Wilderness <dark_gray>↖"
      - offset: [24.5, 7.2, -23.5]
        scale: 1
        text: "<gray>Wilderness <dark_gray>↗"
    displays:
      - offset: [0.5, 28.5, 17.5]
        item: TNT
        scale: 4
        spin: 1
        glow: "#B040FF"
      - offset: [20.5, 12.6, 0.5]
        item: NETHERITE_CHESTPLATE
        scale: 2.4
        spin: 1
        glow: "#FFD24D"
      - offset: [0.5, 17.6, -22]
        item: NETHER_STAR
        scale: 1.4
        spin: -1
        glow: "#FF6B6B"
  skyblock:
    y: 100
    # v3 "the Shattered World": the core + 8 district islands, and the Warzone (PvP) under it
    # Seasonal: "christmas" (snow, icicles, decorated spruces, candy canes, the Great Tree north of the hub portal)
    # or "default". Change it and restart: the spawn is cleared and rebuilt in that theme (NPCs and boards stay put).
    theme: christmas
    # Christmas only: snow falling round players at spawn.
    snow: true
    stand-y: 2
    protect-radius: 115
    catch-falls: true
    # PvP + damage are allowed this far below the floor (the Warzone); building stays protected
    pvp-below: -20
    # [radius, depth, height] cleared before a rebuild: covers the Great Tree island (z -104) and its star (y +42)
    clear: [110, 70, 60]
    portals:
      hub: [0, 7, -61]
    holograms:
      - offset: [0.5, 5.4, -10.5]
        scale: 3
        text: "<#5CFF8A><bold>SKYBLOCK</bold></#5CFF8A>"
      - offset: [0.5, 4.3, -10.5]
        scale: 0.9
        text: "<dark_gray><italic>When the Corrupted world collapsed, the pieces that didn't fall became islands.\n<dark_gray><italic>Every month the void takes them back."
      - offset: [0.5, 3.5, -10.5]
        scale: 1
        text: "<gray>New here? The <white>Getting Started</white> board is to your left <dark_gray>• <white>/is <gray>to start"
      - offset: [0.5, 18.5, -60.5]
        scale: 2
        text: "<gradient:#FF5C5C:#FFA19A><bold>HUB</bold></gradient>"
      - offset: [58.5, 10.5, 0.5]
        scale: 2
        text: "<gradient:#B040FF:#FF4DD2><bold>CAGE SANCTUM</bold></gradient>\n<gray>13 cages, one ladder <dark_gray>• <white>/spawners"
      - offset: [-58.5, 11, 0.5]
        scale: 2
        text: "<gradient:#FFB020:#FF6A3D><bold>GENS FORGE</bold></gradient>\n<gray>Your island remembers deeper ore <dark_gray>• <white>/gen"
      - offset: [-40.5, 11, -40.5]
        scale: 2
        text: "<gradient:#7CFF6B:#38E0FF><bold>MARKET</bold></gradient>\n<gray>Basics + grinder parts <dark_gray>• <white>/market"
      - offset: [41.5, 15.5, -46.5]
        scale: 2
        text: "<gradient:#FFD84D:#FF8A3D><bold>HALL OF CHAMPIONS</bold></gradient>"
      - offset: [41.5, 7.5, 41.5]
        scale: 2
        text: "<gradient:#FFB020:#B040FF><bold>CRATES</bold></gradient>\n<gray>Opening soon"
      - offset: [0.5, 8, 48.5]
        scale: 2.2
        text: "<gradient:#FF4D6D:#B040FF:#FF4D6D:{phase}><bold>THE RIFT</bold></gradient>\n<gray>Jump in: the <white>Warzone<gray> is below <dark_gray>• <red>PvP<dark_gray> • <gray>envoys • KOTH"
      - offset: [0.5, -38, 48.5]
        scale: 1.4
        text: "<gradient:#FF4D6D:#B040FF><bold>WARZONE</bold></gradient>\n<gray>PvP is on <dark_gray>• <gray>combat tag 15s <dark_gray>• <gray>leave: <white>/spawn"
  cannons:
    y: ground
    protect-radius: 25
    catch-falls: false
    portals:
      hub: [0, 5, -15]
    holograms:
      - offset: [0.5, 4.6, -7.5]
        scale: 3
        text: "<#FFAA45><bold>CANNONS</bold></#FFAA45>"
      - offset: [0.5, 3.2, -7.5]
        scale: 1.1
        text: "<gray>Get your own plot: <white>/plot auto <dark_gray>• <white>/plot home <dark_gray>• <white>/plot add <player>\n<white>/tntfill <gray>free fill <dark_gray>• <white>//upload <link> <gray>then <white>//schem load <dark_gray>• <gray>same jar as Factions"
      - offset: [0.5, 10.6, -15]
        scale: 1.4
        text: "<gradient:#FF5C5C:#FFA19A><bold>HUB</bold></gradient>"

# Console commands run once, the first time that server starts (per role).
first-start-commands:
  cannons:
    # plot owners can //paste and //schem inside their own plot (FAWE limits edits to WorldGuard plot regions)
    - "lp group default permission set worldedit.* true"
    - "lp group default permission set lag.cannons.upload true"

# Resource pack (logo, icons, menus). Built from resourcepack/ and published with every release.
resource-pack:
  enabled: true
  required: false
  url: "https://github.com/TheTumster/lag-network/releases/latest/download/RelapsedMC-pack.zip"

hub:
  # Spawn is set with /setspawn; until then players spawn at the world spawn.
  spawn: ""
  double-jump: true
  void-y: -64
  join-title: true
  # Spawn island (tools/hub/genspawn_v4.py). Built once at y=100 on first start; /lagcore rebuildhub places it again.
  auto-build: true
  # Seasonal hub: "christmas" (tools/hub/genspawn_xmas.py: the Great Tree, snowmen, snow, candy canes) or "default".
  # Change it and restart (or /lc reload then /lagcore rebuildhub): the hub is cleared and rebuilt in that theme.
  theme: christmas
  # Christmas only: snow falling round players in the hub.
  snow: true
  # Christmas only: what the theme adds on top of the normal hub (all off again with theme: default).
  christmas:
    # Santa's chat greeting on join (off: the welcome banner carries a Merry Christmas line instead)
    greet: false
    # the moving set pieces (ChristmasFx): sleigh + reindeer circling, toy train round the tree, twinkling tree,
    # fireworks over the tree every 90 s, northern lights behind the palace
    fx: {sleigh: true, train: true, twinkle: true, fireworks: true, aurora: true}
    # holograms from the list above whose text contains one of these are left out (they move, see below)
    # ("=" in front: the whole text must match; otherwise any text containing it)
    hide: ["{logo}", "walk through a gate", "=<#5CFF8A><bold>SKYBLOCK</bold></#5CFF8A>", "=<white>{skyblock} <#B9A8D8>playing",
           "=<#45C8FF><bold>SMP</bold></#45C8FF>", "=<white>{smp} <#B9A8D8>playing",
           "=<#FF4F64><bold>FACTIONS</bold></#FF4F64>", "=<white>{factions} <#B9A8D8>playing",
           "=<#FFAA45><bold>CANNONS</bold></#FFAA45>", "=<white>{cannons} <#B9A8D8>playing"]
    holograms:
      # the logo crowns the Great Tree, above its star
      - offset: [0.5, 107, -102.5]
        scale: 13
        bob: false
        glow: true
        view-range: 10
        text: "{logo}"
      # the gap between the middle gates (where the logo slab stood)
      - offset: [0.5, 6.3, -38.5]
        scale: 1.8
        bob: false
        text: "<gradient:#FF4D4D:#FFFFFF:#3DDC6B><bold>Merry Christmas</bold></gradient> <#C9B8E8>from <gradient:#FF5C5C:#FFA19A><bold>RelapsedMC</bold></gradient>"
      - offset: [0.5, 5.5, -38.5]
        scale: 1.2
        bob: false
        text: "<white>{online} <#C9B8E8>online  <#6A5A80>|  <#C9B8E8>follow a runner to a gate"
      # realm name + count, floating clear in front of each portal house (always facing you)
      - {offset: [-27.91, 12.9, -34.96], scale: 2.4, bob: false, text: "<#5CFF8A><bold>SKYBLOCK</bold></#5CFF8A>"}
      - {offset: [-27.91, 12.15, -34.96], scale: 1.25, bob: false, text: "<white>{skyblock} <#B9A8D8>playing"}
      - {offset: [-11.5, 12.9, -34.5], scale: 2.4, bob: false, text: "<#FF4F64><bold>FACTIONS</bold></#FF4F64>"}
      - {offset: [-11.5, 12.15, -34.5], scale: 1.25, bob: false, text: "<white>{factions} <#B9A8D8>playing"}
      - {offset: [12.5, 12.9, -34.5], scale: 2.4, bob: false, text: "<#FFAA45><bold>CANNONS</bold></#FFAA45>"}
      - {offset: [12.5, 12.15, -34.5], scale: 1.25, bob: false, text: "<white>{cannons} <#B9A8D8>playing"}
      - {offset: [28.91, 12.9, -34.96], scale: 2.4, bob: false, text: "<#45C8FF><bold>SMP</bold></#45C8FF>"}
      - {offset: [28.91, 12.15, -34.96], scale: 1.25, bob: false, text: "<white>{smp} <#B9A8D8>playing"}
      # Santa's Workshop, at the end of the south street
      - offset: [0.5, 12.2, 40.5]
        scale: 2.2
        bob: false
        text: "<gradient:#FF4D4D:#F4C542><bold>Santa's Workshop</bold></gradient>"
      - offset: [0.5, 11.4, 40.5]
        scale: 1.1
        bob: false
        text: "<#C9B8E8>come on in"
      # Santa's speech bubble
      - offset: [4.5, 3.0, -2.5]
        scale: 1.1
        text: "<#FFFFFF>Ho ho ho!"
      # the snowmen at the gates
      - offset: [-22.93, 4.45, -34.53]
        scale: 1.25
        bob: false
        text: "<#5CFF8A><bold>SKYBLOCK</bold></#5CFF8A>\n<white>{skyblock} <#B9A8D8>playing <dark_gray>· <#F4C542>click"
      - offset: [-7.5, 4.45, -31.5]
        scale: 1.25
        bob: false
        text: "<#FF4F64><bold>FACTIONS</bold></#FF4F64>\n<white>{factions} <#B9A8D8>playing <dark_gray>· <#F4C542>click"
      - offset: [8.5, 4.45, -31.5]
        scale: 1.25
        bob: false
        text: "<#FFAA45><bold>CANNONS</bold></#FFAA45>\n<white>{cannons} <#B9A8D8>playing <dark_gray>· <#F4C542>click"
      - offset: [23.93, 4.45, -34.53]
        scale: 1.25
        bob: false
        text: "<#45C8FF><bold>SMP</bold></#45C8FF>\n<white>{smp} <#B9A8D8>playing <dark_gray>· <#F4C542>click"
    # Christmas swaps the hub's floating items for these (the gate icons sit in front of the houses; no crystal star)
    displays:
      - {offset: [-32.5, 3.4, -11.5], item: ECHO_SHARD, scale: 1.6, spin: -1}
      - {offset: [-27.91, 16.2, -34.96], item: GRASS_BLOCK, scale: 1.5, spin: 1, glow: "#7CFF6B"}
      - {offset: [-11.5, 16.2, -34.5], item: TNT, scale: 1.5, spin: 1, glow: "#FF4D6D"}
      - {offset: [12.5, 16.2, -34.5], item: DISPENSER, scale: 1.5, spin: 1, glow: "#FF9F4D"}
      - {offset: [28.91, 16.2, -34.96], item: OAK_SAPLING, scale: 1.5, spin: 1, glow: "#7CFF6B"}
    # click any of them: Santa opens the realm menu, a snowman sends you to its realm
    npcs:
      - {type: santa, offset: [4.5, 0, -2.5], yaw: 53}
      - {type: snowman, realm: skyblock, offset: [-22.93, 2, -34.53], yaw: -32}
      - {type: snowman, realm: factions, offset: [-7.5, 2, -31.5], yaw: 0}
      - {type: snowman, realm: cannons, offset: [8.5, 2, -31.5], yaw: 0}
      - {type: snowman, realm: smp, offset: [23.93, 2, -34.53], yaw: 32}
  night: true
  time: 18000
  # Walk into a portal = join that realm. [x, y, z] from the spawn floor centre (spawn faces north = -z).
  portals:
    skyblock: [-30, 5, -38]
    factions: [-12, 5, -38]
    cannons: [12, 5, -38]
    smp: [30, 5, -38]
  # The beacon under the crystal (particle helix), from the spawn.
  beacon: [0, -1, -12]  # no beacon block anymore; the particle helix still spirals up from the Well
  # Floating text ([x, y, z] from the spawn floor centre). {factions} {smp} {online} = player counts,
  # {phase} = moving gradient (animates every 2 ticks), {logo} = the pack logo.
  holograms:
    # spawn: the logo and one quiet line. Lore and realm info live in the Codex (hotbar book), not on walls.
    - offset: [0.5, 5.9, -37.5]
      scale: 3.8
      bob: false
      text: "{logo}"
    - offset: [0.5, 4.3, -37.5]
      scale: 1.5
      bob: false
      text: "<white>{online} <#C9B8E8>online  <#6A5A80>|  <#C9B8E8>walk through a gate"
    # each gate: the name sits on the cornice ledge, the player count under it on the arch
    - offset: [-29.5, 12.75, -35.8]
      scale: 2.6
      billboard: fixed
      yaw: 0
      bob: false
      text: "<#5CFF8A><bold>SKYBLOCK</bold></#5CFF8A>"
    - offset: [-29.5, 12.0, -35.8]
      scale: 1.3
      billboard: fixed
      yaw: 0
      bob: false
      text: "<white>{skyblock} <#B9A8D8>playing"
    - offset: [-11.5, 12.75, -35.8]
      scale: 2.6
      billboard: fixed
      yaw: 0
      bob: false
      text: "<#FF4F64><bold>FACTIONS</bold></#FF4F64>"
    - offset: [-11.5, 12.0, -35.8]
      scale: 1.3
      billboard: fixed
      yaw: 0
      bob: false
      text: "<white>{factions} <#B9A8D8>playing"
    - offset: [12.5, 12.75, -35.8]
      scale: 2.6
      billboard: fixed
      yaw: 0
      bob: false
      text: "<#FFAA45><bold>CANNONS</bold></#FFAA45>"
    - offset: [12.5, 12.0, -35.8]
      scale: 1.3
      billboard: fixed
      yaw: 0
      bob: false
      text: "<white>{cannons} <#B9A8D8>playing"
    - offset: [30.5, 12.75, -35.8]
      scale: 2.6
      billboard: fixed
      yaw: 0
      bob: false
      text: "<#45C8FF><bold>SMP</bold></#45C8FF>"
    - offset: [30.5, 12.0, -35.8]
      scale: 1.3
      billboard: fixed
      yaw: 0
      bob: false
      text: "<white>{smp} <#B9A8D8>playing"
    - offset: [-32.5, 4.8, -11.5]
      scale: 1.4
      text: "<gradient:#FFA19A:#FF5C5C><bold>DISCORD</bold></gradient>\n<#B9A8D8>coming soon"
  # Spinning, glowing 3D items (the realm icons spin inside their portals). glow = outline colour.
  displays:
    - offset: [0.5, 42.8, -11.5]
      item: NETHER_STAR
      scale: 4
      spin: 1
      glow: "#B040FF"
    - offset: [-29.5, 16.5, -36.5]
      item: GRASS_BLOCK
      scale: 1.5
      spin: 1
      glow: "#7CFF6B"
    - offset: [-11.5, 16.5, -36.5]
      item: TNT
      scale: 1.5
      spin: 1
      glow: "#FF4D6D"
    - offset: [12.5, 16.5, -36.5]
      item: DISPENSER
      scale: 1.5
      spin: 1
      glow: "#FF9F4D"
    - offset: [30.5, 16.5, -36.5]
      item: OAK_SAPLING
      scale: 1.5
      spin: 1
      glow: "#7CFF6B"
    - offset: [-32.5, 3.4, -11.5]
      item: ECHO_SHARD
      scale: 1.6
      spin: -1
  # Heavy pressure plates on the paths launch you outward.
  launch-pad:
    speed: 1.25
    lift: 0.85
  # Boss bar messages, 8s each. {gradient}...</gradient> = moving brand gradient.
  bossbar:
    - "<gray>Welcome to {gradient}<bold>{network}</bold></gradient>"
    - "{gradient}<bold>FACTIONS</bold></gradient> <dark_gray>» <gray>1.8 cannons, raids, faction TNT banks"
    - "<white>{online} <gray>players online <dark_gray>• <gray>walk into a portal to play"
    - "{gradient}<bold>COSMETICS</bold></gradient> <dark_gray>» <gray>grab a particle trail from your hotbar"

scoreboard:
  enabled: true
  # same board on every realm; these are the small per-realm differences
  money: {skyblock: "Shards|◆", smp: "Balance|$"}
  realm-lines:
    skyblock: ["{L}ɪꜱʟᴀɴᴅ {V}/is"]
    smp: ["{L}ᴄʟᴀɪᴍꜱ {V}/claimhelp"]
    cannons: ["{L}ᴘʟᴏᴛ {V}/plot home"]
  footer: "<gradient:#FF5C5C:#FFA19A>play.RelapsedMC.com</gradient>"

# RelapsedMC Teams: one team across every realm, stored in <network>/shared/teams.db (shared by all servers).
teams:
  max-size: 8
