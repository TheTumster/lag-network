# Core plugin. The SAME network name goes in every server's copy of this file.
network-name: "RelapsedMC"

# What this server is: hub, factions or smp. Hub features (selector item, no damage, etc.) only run on the hub.
role: hub

# Realms shown in the server selector. "server" must match the name in the proxy's velocity.toml.
realms:
  factions:
    server: factions
    name: "<gradient:#38E0FF:#B040FF><bold>FACTIONS</bold></gradient>"
    icon: TNT
    slot: 11
    lore:
      - "<gray>Raid, cannon, claim, conquer."
      - "<gray>1.8 PvP  •  1.8 cannon physics"
      - ""
      - "<#38E0FF>▶ Click to play"
  smp:
    server: smp
    name: "<gradient:#38E0FF:#B040FF><bold>SMP</bold></gradient>"
    icon: GRASS_BLOCK
    slot: 15
    lore:
      - "<gray>Chill survival with land claims."
      - ""
      - "<#38E0FF>▶ Click to play"

# Fresh chat: wipe the chat when you arrive on a server, then show that realm's banner (the hub has its own).
# {bar} {logo} {arrow} {player} {online}
fresh-chat:
  enabled: true
  delay-ticks: 10
  banner:
    factions:
      - "{bar}"
      - "            {logo} <dark_gray>» <gradient:#FF4D6D:#B040FF><bold>FACTIONS</bold></gradient>"
      - ""
      - "  {arrow} <gray>Start a faction: <white>/f create <name>"
      - "  {arrow} <gray>Fill dispensers: <white>/tntfill <dark_gray>• <gray>faction bank: <white>/f tnt"
      - "  {arrow} <gray>Back to the hub: <white>/hub"
      - "{bar}"
    smp:
      - "{bar}"
      - "            {logo} <dark_gray>» <gradient:#7CFF6B:#38E0FF><bold>SMP</bold></gradient>"
      - ""
      - "  {arrow} <gray>Chill survival with land claims"
      - "  {arrow} <gray>Back to the hub: <white>/hub"
      - "{bar}"

# Ranks for the scoreboard: LuckPerms group name -> how it shows. First match wins (ops match the first).
ranks:
  owner: "<gradient:#FF4D6D:#FF4DD2><bold>OWNER</bold></gradient>"
  admin: "<#FF4D6D><bold>ADMIN</bold>"
  mod: "<#38E0FF><bold>MOD</bold>"
  media: "<#FF4DD2><bold>MEDIA</bold>"
  vip: "<gradient:#38E0FF:#B040FF><bold>VIP</bold></gradient>"

# Resource pack (logo, icons, menus). Built from resourcepack/ and published with every release.
resource-pack:
  enabled: true
  required: false
  url: "https://github.com/TheTumster/lag-network/releases/latest/download/RelapsedMC-pack.zip"

hub:
  # Spawn is set with /setspawn; until then players spawn at the world spawn.
  spawn: ""
  double-jump: true
  void-y: -64
  join-title: true
  # Spawn island (tools/hub/genspawn.py). Built once at y=100 on first start; /lagcore rebuildhub places it again.
  auto-build: true
  night: true
  time: 18000
  # Walk into a portal = join that realm. [x, y, z] from the spawn floor centre.
  portals:
    factions: [0, 4, -25]
    smp: [0, 4, 25]
  # Floating text ([x, y, z] from the spawn floor centre). {factions} {smp} {online} = player counts,
  # {phase} = moving gradient (animates every 2 ticks).
  holograms:
    - offset: [0.5, 16.5, 0.5]
      scale: 2.2
      text: "{logo}"
    - offset: [0.5, 15.2, 0.5]
      scale: 1.6
      text: "<gray>Factions <dark_gray>• <gray>SMP <dark_gray>• <gray>1.8 Cannons    <white>{online} <gray>online"
    - offset: [0.5, 14.5, -25]
      scale: 2.4
      text: "<gradient:#FF4D6D:#B040FF:#FF4D6D:{phase}><bold>FACTIONS</bold></gradient>\n<gray>Raid • Cannon • Conquer\n<white>{factions} <gray>playing"
    - offset: [0.5, 14.5, 25]
      scale: 2.4
      text: "<gradient:#7CFF6B:#38E0FF:#7CFF6B:{phase}><bold>SMP</bold></gradient>\n<gray>Chill survival with claims\n<white>{smp} <gray>playing"
    - offset: [-21.5, 8.5, 0.5]
      scale: 1.4
      text: "<gradient:#38E0FF:#B040FF:#38E0FF:{phase}><bold>WELCOME</bold></gradient>\n<gray>Walk into a portal to play\n<gray>or right click your <white>compass\n<gray>Launch pads on every path\n<gray>Double jump with <white>SPACE"
    - offset: [22.5, 8.5, 0.5]
      scale: 1.4
      text: "<gradient:#B040FF:#38E0FF:#B040FF:{phase}><bold>DISCORD</bold></gradient>\n<gray>Coming soon"
  # Spinning, glowing 3D items. spin = speed (1 = a quarter turn every 2s), glow = outline colour.
  displays:
    - offset: [0.5, 21.5, 0.5]
      item: NETHER_STAR
      scale: 3.5
      spin: 1
      glow: "#B040FF"
    - offset: [0.5, 19, -25]
      item: TNT
      scale: 2.4
      spin: 1
      glow: "#FF4D6D"
    - offset: [0.5, 19, 25]
      item: GRASS_BLOCK
      scale: 2.4
      spin: 1
      glow: "#7CFF6B"
    - offset: [-21.5, 12.5, 0.5]
      item: AMETHYST_CLUSTER
      scale: 1.6
      spin: -1
    - offset: [22.5, 12.5, 0.5]
      item: ECHO_SHARD
      scale: 1.6
      spin: -1
  # Heavy pressure plates on the paths launch you outward.
  launch-pad:
    speed: 1.25
    lift: 0.85
  # Boss bar messages, 8s each. {gradient}...</gradient> = moving brand gradient.
  bossbar:
    - "<gray>Welcome to {gradient}<bold>{network}</bold></gradient>"
    - "{gradient}<bold>FACTIONS</bold></gradient> <dark_gray>» <gray>1.8 cannons, raids, faction TNT banks"
    - "<white>{online} <gray>players online <dark_gray>• <gray>walk into a portal to play"
    - "{gradient}<bold>COSMETICS</bold></gradient> <dark_gray>» <gray>grab a particle trail from your hotbar"

scoreboard:
  enabled: true
  footer: "<gradient:#38E0FF:#B040FF>RelapsedMC</gradient>"
