# In-world panels, one per server role. Positions are relative to that server's spawn origin (spawns.<role>.origin).
# box: [left, bottom, right, top] in blocks from the panel's bottom centre (width 7.6 -> -3.8..3.8, height 4.4).
# Layout grid: cards live between v=0.45 and v=3.15; columns -3.65..-1.9 | -1.8..-0.05 | 0.05..1.8 | 1.9..3.65
# action: cmd:<command run as the player> | tab:<tab id> | msg:<MiniMessage text>
# Edit a copy at plugins/laGCore/panels.yml and run /lc reload to see changes live.
skyblock:
  # fills the kiosk opening (between the posts, counter to roof) on the skyblock spawn
  at: [-11.92, 2.05, 1.0]
  facing: east
  width: 7.6
  height: 4.4
  range: 26
  frame: polished_blackstone
  background: black_concrete
  title: "<gradient:#7CFF6B:#38E0FF><bold>GETTING STARTED</bold></gradient>"
  title-size: 1.1
  footer: "<dark_gray>Look at a card and click"
  tabs:
    - id: home
      label: HOME
      cards:
        - box: [-3.65, 1.45, -1.9, 3.15]
          color: gray_concrete
          accent: lime_concrete
          icon: PLAYER_HEAD
          icon-size: 0.6
          title: "<white><bold>{player}"
          title-size: 0.55
          lines: ["<gray>Welcome to", "<gradient:#7CFF6B:#38E0FF><bold>SKYBLOCK"]
          line-size: 0.5
        - box: [-1.8, 1.45, -0.05, 3.15]
          color: gray_concrete
          accent: lime_concrete
          icon: GRASS_BLOCK
          icon-size: 0.55
          title: "<#7CFF6B><bold>1. ISLAND"
          title-size: 0.6
          lines: ["<gray>Create your island", "<white>/is"]
          line-size: 0.5
          action: "cmd:is"
        - box: [0.05, 1.45, 1.8, 3.15]
          color: gray_concrete
          accent: light_blue_concrete
          icon: DIAMOND_ORE
          icon-size: 0.55
          title: "<#38E0FF><bold>2. GENERATE"
          title-size: 0.6
          lines: ["<gray>Mine ores,", "<gray>upgrade your gen"]
          line-size: 0.5
          action: "tab:gens"
        - box: [1.9, 1.45, 3.65, 3.15]
          color: gray_concrete
          accent: purple_concrete
          icon: SPAWNER
          icon-size: 0.55
          title: "<#B040FF><bold>3. AFK"
          title-size: 0.6
          lines: ["<gray>Spawners drop heads,", "<gray>heads unlock tiers"]
          line-size: 0.5
          action: "tab:spawners"
        - box: [-3.65, 0.45, -1.9, 1.3]
          color: gray_concrete
          icon: EMERALD
          icon-size: 0.32
          title: "<white><bold>SHOP"
          title-size: 0.5
          action: "cmd:shop"
        - box: [-1.8, 0.45, -0.05, 1.3]
          color: gray_concrete
          icon: GOLDEN_HELMET
          icon-size: 0.32
          title: "<white><bold>ISLAND TOP"
          title-size: 0.5
          action: "cmd:is top"
        - box: [0.05, 0.45, 1.8, 1.3]
          color: gray_concrete
          icon: WRITABLE_BOOK
          icon-size: 0.32
          title: "<white><bold>CHALLENGES"
          title-size: 0.5
          action: "cmd:is challenges"
        - box: [1.9, 0.45, 3.65, 1.3]
          color: gray_concrete
          icon: OAK_SIGN
          icon-size: 0.32
          title: "<white><bold>WARPS"
          title-size: 0.5
          action: "cmd:is warps"
    - id: island
      label: ISLAND
      cards:
        - box: [-3.65, 1.45, -0.05, 3.15]
          color: gray_concrete
          accent: lime_concrete
          icon: GRASS_BLOCK
          icon-size: 0.55
          title: "<#7CFF6B><bold>YOUR ISLAND"
          title-size: 0.6
          lines: ["<white>/is <gray>go home", "<white>/is invite <gray>add a teammate"]
          line-size: 0.5
          action: "cmd:is"
        - box: [0.05, 1.45, 3.65, 3.15]
          color: gray_concrete
          accent: light_blue_concrete
          icon: SPAWNER
          icon-size: 0.55
          title: "<#38E0FF><bold>ISLAND VALUE"
          title-size: 0.6
          lines: ["<gray>Placed spawners", "<gray>rank your island"]
          line-size: 0.5
          action: "cmd:is top"
        - box: [-3.65, 0.45, -0.05, 1.3]
          color: gray_concrete
          icon: ANVIL
          icon-size: 0.32
          title: "<white><bold>UPGRADES"
          title-size: 0.5
          action: "cmd:is upgrades"
        - box: [0.05, 0.45, 3.65, 1.3]
          color: gray_concrete
          icon: NETHERITE_SWORD
          icon-size: 0.32
          title: "<red><bold>THE PIT"
          title-size: 0.5
          action: "cmd:pit"
    - id: gens
      label: GENERATORS
      cards:
        - box: [-3.65, 0.45, 3.65, 3.15]
          color: gray_concrete
          accent: light_blue_concrete
          icon: DIAMOND_ORE
          icon-size: 0.7
          title: "<#38E0FF><bold>ORE GENERATORS"
          title-size: 0.7
          lines: ["<gray>Your cobble generator makes ores.", "<gray>Upgrade it for better ones:", "<white>Coal → Iron → Gold → Diamond → Emerald", "<white>/gen"]
          line-size: 0.5
          action: "cmd:gen"
    - id: spawners
      label: SPAWNERS
      cards:
        - box: [-3.65, 0.45, 3.65, 3.15]
          color: gray_concrete
          accent: purple_concrete
          icon: SPAWNER
          icon-size: 0.7
          title: "<#B040FF><bold>SPAWNERS"
          title-size: 0.7
          lines: ["<gray>Spawners drop mob heads while you AFK.", "<gray>Sell the heads, or trade them in", "<gray>to unlock the next spawner tier.", "<white>/spawners"]
          line-size: 0.5
          action: "cmd:spawners"
    - id: season
      label: SEASON
      cards:
        - box: [-3.65, 0.45, 3.65, 3.15]
          color: gray_concrete
          accent: yellow_concrete
          icon: NETHER_STAR
          icon-size: 0.7
          title: "<gradient:#FFD84D:#FF8A3D><bold>THIS SEASON"
          title-size: 0.7
          lines: ["<gray>Every month the void takes the islands back.", "<gray>Top islands win <gold>store credit<gray>, #1 a", "<gradient:#FFD84D:#FF8A3D><bold>CHAMPION</bold></gradient> <gray>title forever.", "<white>/season"]
          line-size: 0.5
          action: "cmd:season"
